services:
  advisor:
    build: .
    container_name: t212-ai-advisor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/London
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    mem_limit: 2g
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true
