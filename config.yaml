# Trading 212 x Gemini AI Advisor v5.0 Strategy & Runtime Config

app:
  timezone: "Europe/London"
  db_path: "data/advisor.db"
  log_level: "INFO"
  cache_ttl_seconds: 120
  market_data_ttl_seconds: 900
  grounding_cache_ttl_seconds: 10800  # 3h SQLite 跨指令新闻搜索快照有效期
  ops_warn_cooldown_seconds: 1800

models:
  # [混合路由 + 双向灾备] 搜索与核心决策留 Gemini，日常单聊 / 平稳 /us / T+5 反思用 DeepSeek V4.1 Flash (HIGH)
  report_analyst_model: "gemini-4-hydrogen"         # /report Step 2A 机会分析
  report_auditor_model: "gemini-4-hydrogen"         # /report Step 2B Bear 挑刺审计官 (HIGH)
  report_model: "gemini-4-neon"                     # /report Step 3 PM 拍板 (金融最优性价比 HIGH)
  us_sentinel_model: "deepseek-flash"               # /us 平稳日哨兵 (HIGH)
  us_anomaly_model: "gemini-4-hydrogen"             # /us 触发异动门控时自动切入高阶模型
  pick_researcher_model: "gemini-4-hydrogen"        # /pick Stage 1 投研探测
  pick_model: "gemini-4-neon"                       # /pick Stage 2 风控官终审拍板 (MEDIUM)
  chat_model: "deepseek-flash"                      # Telegram 日常单聊 & 盘后 T+5 反思
  chat_deep_model: "gemini-4-neon"                  # /deep 深度单聊升级模型 (MEDIUM)
  fallback_model: "gemini-4-hydrogen"               # Gemini 节点同厂降级备援模型
  gemini_fallback_model: "gemini-4-hydrogen"        # DeepSeek 故障时切回 Gemini 备援模型
  deepseek_fallback_model: "deepseek-flash"         # Gemini 故障时跨厂商兜底模型（非搜索节点）
  report_priority_search_model: "gemini-4-hydrogen" # 早报宏观与重点异动 1v1 深度联网搜索
  report_search_model: "gemini-3.5-flash-lite"      # 早报常规 3 股批次联网搜索（0 思考高性价比）
  search_model: "gemini-3.5-flash-lite"             # 单聊 / /pick / /us 联网搜索模型

  report_analyst_thinking_level: "HIGH"             # 机会分析保持 HIGH 深度挖掘
  report_auditor_thinking_level: "HIGH"             # Hydrogen Bear 挑刺审计深度
  report_thinking_level: "HIGH"                     # PM 拍板保持 HIGH
  us_thinking_level: "HIGH"                         # /us 平稳日 DeepSeek 保持 HIGH（不用 LOW）
  us_anomaly_thinking_level: "HIGH"                 # /us 异动日 Gemini 保持 HIGH
  pick_researcher_thinking_level: "HIGH"            # 选股初研保持 HIGH 深度挖掘
  pick_thinking_level: "MEDIUM"                     # Neon 终审用 MEDIUM 兼顾金融精度与成本
  chat_thinking_level: "HIGH"                       # 日常单聊与 T+5 反思均用 DeepSeek HIGH
  chat_deep_thinking_level: "MEDIUM"                # /deep 单聊 Neon MEDIUM 深度思考
  fallback_thinking_level: "HIGH"
  gemini_fallback_thinking_level: "MEDIUM"          # DeepSeek 故障切回 Hydrogen MEDIUM
  deepseek_fallback_thinking_level: "HIGH"          # Gemini 故障切入 DeepSeek HIGH
  prefer_deepseek_over_flash_lite: true             # 非联网备援先切 DeepSeek HIGH，再退 3.5-flash-lite LOW
  report_priority_search_thinking_level: "LOW"      # 早报宏观/异动 1v1 搜索用 LOW 兼顾检索深度与成本

  enable_forced_search_grounding: true
  report_max_tool_rounds: 2
  # [v5.3.3 调用级韧性] 单轮硬超时 / 5xx 重试预算 / 硬超时重试预算（0 = 超时立即切备援，不再空等）
  gemini_round_timeout_seconds: 120.0
  gemini_max_transient_retries: 2
  gemini_timeout_max_retries: 0
  # /report Step 2（R1 Bull/Bear 并发 → R2 DeepSeek 交叉质询 → R3 双中立）分段预算 + 总闸
  report_step2_timeout_seconds: 660.0
  report_step2_round1_seconds: 360.0
  report_step2_round2_seconds: 180.0
  report_step2_round3_seconds: 120.0
  # PM 单次调用上限：Carbon 思考慢，避免 120s 被硬切到备援
  report_pm_timeout_seconds: 300.0
  # 第二轮辩论：R2 双向质询（各 2400 字）+ R3 中立摘要/证据核验，每天固定跑
  report_debate_enabled: true
  report_debate_model: "deepseek-flash"
  report_debate_thinking_level: "HIGH"
  report_debate_max_chars: 2400
  report_debate_max_output_tokens: 16384
  report_neutral_model: "deepseek-flash"
  report_neutral_thinking_level: "HIGH"
  report_neutral_digest_max_chars: 900
  report_neutral_factcheck_max_chars: 400
  google_search_free_quota_monthly: 5000    # Google Search Grounding 月免费额度参考线
  google_search_warn_pct: 85.0              # 达到月免费额度该百分比时预警提醒

  # [DeepSeek V4.1 Flash 侧车] 仅做 ID 筛选 / 只读语义质检 / 独立周报与盘中快报 / 带原话锚点记忆抽取
  ds_helper_model: "deepseek-flash"
  ds_helper_thinking_level: "HIGH"
  ds_helper_timeout_seconds: 40.0           # 单次侧车硬超时（超时静默降级回原逻辑）
  ds_pick_prefilter_enabled: true           # /pick 宽漏斗 30 只 -> 8+8 ID 初筛
  ds_semantic_audit_enabled: true           # /report 与 /pick 渲染后只读语义质检（只告警不拦截）

schedule:
  morning_report_hour: 7
  morning_report_minute: 30
  premarket_lead_minutes: 15
  enable_weekly_radar: true
  weekly_radar_after_close_minutes: 30

strategy:
  cash_interest_rate_pct: 4.0       # T212 uninvested GBP cash APY (%)
  usd_cash_interest_rate_pct: 3.4   # Invest USD wallet uninvested cash APY (%)
  fx_fee_pct: 0.15                  # T212 FX fee per leg for non-GBP trades (%)
  uk_stamp_duty_pct: 0.50           # UK Stamp Duty on UK-domiciled individual stocks (ETFs = 0%)
  # Invest GBP+USD dual-wallet ledger (API v0 cannot split cash by currency)
  invest_multi_currency_enabled: true    # Attach local wallet split to Invest snapshots
  wallet_reconcile_warn_days: 7          # Warn when the USD wallet anchor is older than N days
  wallet_mismatch_warn_gbp: 10.0         # Warn when reported GBP+USD total deviates from API cash (£, also >2%)
  order_history_days: 30
  order_history_max_pages: 3
  max_daily_chat_turns: 12

  # Deterministic Add/Trim/Stop/Correlation guardrails (portfolio_rules.py & screener.py)
  max_isa_single_weight_pct: 30.0
  max_invest_single_weight_pct: 25.0
  max_total_portfolio_weight_pct: 22.0  # 跨 ISA+Invest 同发行人个股上限（宽基/行业 ETF 豁免）
  invest_stop_loss_alert_pct: -12.0
  invest_take_profit_review_pct: 25.0
  trailing_profit_activation_pct: 20.0  # 浮盈 >=20% 后激活近60日波段高点移动止盈保护
  trailing_drawdown_from_peak_pct: -12.0
  isa_deep_drawdown_review_pct: -25.0   # ISA 长线仓深套基本面防死扛复核线
  rsi_oversold_threshold: 38.0
  rsi_overbought_threshold: 75.0
  pullback_from_high_add_min_pct: -25.0
  pullback_from_high_add_max_pct: -8.0
  require_uptrend_for_add: true         # 须严格满足 Price > MA200 才触发加仓提示
  overlap_correlation_threshold: 0.85
  correlation_window_days: 60

  # 基准相对收益 + 对称攻防纪律（VWRP.L = 全球宽基基准；现金利息仅作等待期保底，不再是投资终点）
  benchmark_symbol: "VWRP.L"
  min_invest_order_gbp: 700.0             # Invest 单笔最小建仓额（防碎单）
  min_isa_equity_order_gbp: 1200.0        # ISA 个股单笔最小建仓额
  min_isa_etf_order_gbp: 400.0            # ISA 宽基/主题 ETF 单笔最小建仓额
  invest_risk_budget_gbp: 85.0            # 单笔最大可承受亏损（以损定仓）
  max_weekly_new_buys: 2                  # 近 7 天新开仓笔数硬上限
  max_monthly_new_buys: 6                 # 近 30 天新开仓笔数硬上限
  rebuy_cooldown_days: 15                 # 清仓后同标的冷却天数
  trade_cadence_guard_mode: "hard"        # off=不检查 / advisory=仅提示 / hard=Python 硬拦截（v5.5.0 起默认硬拦）
  isa_cash_deploy_trigger_pct: 15.0       # ISA 现金占比高于此值须给出具体部署提案
  invest_cash_idle_warn_pct: 40.0         # Invest 现金长期高于此值提醒资金效率低下
  spread_estimate_us_pct: 0.05            # 美股/欧股买卖价差估算（半价差口径，%）
  spread_estimate_uk_eu_pct: 0.20         # 英股/LSE ETF 买卖价差估算（半价差口径，%）

  # v5.3.4 /pick 买入侧确定性护栏（把 2:1 门槛与以损定仓从提示词搬进 Python）
  pick_rr_guard_mode: "hard"              # off=不检查 / advisory=仅提示 / hard=Python 硬拦截（v5.5.0 起默认硬拦）
  min_rr_ratio: 2.0                       # Python 复算 R:R 下限（目标空间扣摩擦 ÷ 止损幅度）
  ex_div_entry_guard_days: 3              # 距除息 ≤N 天的新建仓提示/拦截窗口（0=关闭）

  # --- v5.4.0 组合门控、ISA 核心-卫星结构与 Invest 渐进式火力引擎 ---
  deployment_gate_mode: "advise"          # off=完全关闭旁路 / log=仅写日志与 context_pack / advise=早报渲染并联动 /pick
  gate_epoch_date: "2026-11-18"           # 新纪元起算日(YYYY-MM-DD)：此日期前的历史亏损与老仓出清不计入连损冷静惩罚
  # 1) 集中度与 ISA 核心-卫星结构护栏
  max_single_name_portfolio_pct: 12.0     # 单一公司跨双账户占全组合硬上限（核心宽基 ETF 豁免）
  isa_core_etf_target_pct: 60.0           # ISA 核心宽基目标占比（%）
  isa_satellite_max_total_pct: 30.0       # ISA 个股卫星层（持仓+未成交个股BUY挂单）占 ISA 硬上限（%）
  isa_satellite_max_count: 8              # ISA 个股卫星层最大只数（持仓+未成交新个股BUY挂单）
  isa_crumb_pruning_max_per_report: 2     # 单次早报最多温和提示顺势归核的 <£1,200 边角料只数
  isa_crumb_near_breakeven_floor_pct: -3.0  # 边角料顺风归核浮亏下限（>=-3% 视为接近回本/微盈区）
  isa_cash_band_low_pct: 5.0              # ISA 结构现金垫下沿（%）
  isa_cash_band_high_pct: 15.0            # ISA 常规现金上沿（%）
  min_deploy_excess_pct: 3.0              # 超过现金上沿多少百分点触发 ISA 宽基 dca（15+3=18%）
  # 2) Invest 在险槽位与以盈解锁（仅核算 Invest 账户自身）
  invest_slots_risk_on: 2                 # RISK_ON 最大同时未脱险个股槽位数
  invest_slots_neutral: 1                 # NEUTRAL 最大同时未脱险个股槽位数（单侦察兵）
  invest_slots_risk_off: 0                # RISK_OFF 个股槽位数（0 = 冻结新开个股）
  max_new_equity_entries_per_day: 1       # 单日最多新开/新挂个股笔数（Best Idea Only）
  consecutive_loss_limit: 2               # gate_epoch_date 后近 14 天连续止损笔数阈值
  consecutive_loss_lookback_days: 14      # 连损回溯窗口（天）
  consecutive_loss_cooldown_days: 5       # 连损触发后的个股冷静观察天数（交易日/自然日折算 7 天）
  recovery_pilot_risk_scale: 0.5          # 冷静期满首笔试探单风险缩放系数（0.5R = £42.5）
  # 3) 去汇率失真市场状态（Regime）与 A/C 触发器
  regime_benchmark_symbol: "SPY"          # 美元原币种全球/美股核心趋势锚（防 GBP/USD 扭曲 VWRP.L）
  regime_vix_risk_on: 18.0                # 进入 RISK_ON 的波动率上限
  regime_vix_exit_risk_off: 25.0          # 退出 RISK_OFF 回到 NEUTRAL 的波动率缓解线（严禁用 18.0 防死锁！）
  regime_ma200_band_pct: 3.0              # 实质跌破 MA200 的缓冲带（%）
  regime_drawdown_neutral_pct: 8.0        # 常规回调进入 NEUTRAL 阈值（%）
  regime_drawdown_risk_off_pct: 15.0      # 深度回撤进入 RISK_OFF 阈值（%）
  regime_hy_oas_risk_off_pct: 5.5         # 高收益债利差进入 RISK_OFF 阈值（%）
  regime_confirm_enter_days: 1            # 进入 RISK_OFF 快速确认天数
  regime_confirm_exit_days: 3             # 退出 RISK_OFF / 进入 RISK_ON 稳定确认天数
  core_etf_drawdown_steps_pct: [5.0, 10.0, 15.0, 20.0]  # ISA 宽基距52周高点分档折扣触发阶梯
  trigger_ma_tolerance_pct: 1.5           # 右侧趋势个股回踩 MA50 容差带（%）
  trigger_max_symbols: 3                  # A 触发器最多输出候选标的数
  inflow_trigger_pct: 2.0                 # C 触发器单日外部净入金占账户比例（%）
  inflow_trigger_min_gbp: 400.0           # C 触发器最小净入金绝对额（£）

  # /us intraday anomaly gate & T+N settlement horizon (IMP-12 / IMP-16)
  us_anomaly_move_pct: 1.8
  us_anomaly_vix_change_pct: 4.0
  settlement_holding_days: 5

  # /pick wide funnel: quant screener returns up to 15/track, DeepSeek keeps 8/track (raw objects untouched)
  pick_wide_funnel_top_n: 15
  pick_prefilter_keep_per_track: 8
  pick_search_symbols_per_track: 8          # Google Search / Finnhub 深挖的每轨标的数

  # 会话偏好记忆：每日结算末尾单跳抽取用户原话，默认 14 天过期
  user_preference_memory_enabled: false
  preference_ttl_days: 14
  preference_max_notes_per_day: 3

  # 盘中主动盯盘哨兵（0-Token 扫描；仅异动才联网 + DS 决定是否推送）
  intraday_sentinel_enabled: true
  intraday_poll_minutes: 30
  intraday_move_alert_pct: 3.5
  intraday_order_near_pct: 1.5
  intraday_fill_receipt_enabled: true   # 挂单成交回执（快照比对 + 历史成交交叉验证，0 额外 API）

# Optional priority symbols (Yahoo Finance symbols, e.g. ["TSM", "AZN.L", "ASML.AS"])
watchlist: []

